[pytest]
# Default behavior:
# - Verbose output (-v)
# - Disable warnings clutter (--disable-warnings)
# - Exclude tests marked as slow (-m "not slow")
addopts = -v --disable-warnings -m "not slow"
testpaths = tests
python_files = test_*.py
pythonpath = .
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
